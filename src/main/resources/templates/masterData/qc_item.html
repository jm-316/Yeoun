<th:block xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{/layouts/layout.html}">
<head>
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css}" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/grid/latest/tui-grid.css}" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<th:block layout:fragment="pageCss">
	<style>
		.tui-grid-cell:has(.modified-cell-highlight) {
			/* 부모 셀의 배경색을 덮어씁니다. */
			background-color: #FFE5E5 !important;
			color: #000 !important;
		}

		.modified-cell-highlight {
			background-color: #FFE5E5 !important;
			color: #000 !important;
			width: 100% !important; 
			height: 100% !important;
			padding: 0 !important; /* 내부 패딩을 제거하여 가장자리까지 채움 */
		}
	</style>
</th:block>
<body>
<th:block layout:fragment="content">
	<div class="custom-body container-xxl flex-grow-1 container-p-y">
	<h2>품질항목기준</h2>
	<div class="d-flex g-2 align-items-center mb-3">
		<!-- 검색 조건들 묶음 -->
		<div
			class="col-12 col-lg d-flex align-items-center gap-2">
			<!-- 키워드 -->
			<input type="text" class="form-control" placeholder="QC항목ID 또는 항목명을 입력하세요"
				id="qcItemKeyword" style="width: 65%;">
			<!-- 조회 버튼 -->
			<button class="btn btn-outline-primary" id="searchbtn">검색</button>
		</div>
		<div class="col-12 col-lg d-flex justify-content-end gap-2">
			<button type="button" class="btn btn-primary btn-md-sm" data-bs-toggle="modal" data-bs-target="#qcItem-modal"
				id="qcItemRegistBtn" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')">등록
			</button>
		</div>
	</div>
	<div id="qcItemGrid" style="display: grid;"></div>
		<!-- QC 항목 등록 모달 -->
		<div class="modal fade" id="qcItem-modal" tabindex="-1">
		  <div class="modal-dialog modal-lg modal-dialog-centered">
		    <div class="modal-content">
		      <div class="modal-header">
		        <h5 id="qcmodalTilte" class="modal-title">QC 항목 등록</h5>
		        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		      </div>
			  <div class="row g-2 align-items-center">
			    <input type="hidden" id="modalNewModify" name="mode" value="">

			  <div class="modal-body small-text">
		        <div class="row g-3">
		          <div class="col-md-4">
		            <label class="form-label required">QC 항목ID</label>
		            <input type="text" id="modalQcItemId" name="qcItemId" class="form-control form-control-sm" required/>
		          </div>
		
		          <div class="col-md-4">
		            <label class="form-label required">항목명</label>
		            <input type="text" id="itemName" name="itemName" class="form-control form-control-sm" required/>
		          </div>
		
		          <div class="col-md-4">
		            <label class="form-label required">대상구분</label>
					<select id="targetType" name="targetType" class="form-select form-select-sm">
						<option value="" disabled hidden>대상구분</option>
						<option th:each="item : ${targetTypeList}" 
								th:value="${item.codeId}" 
								th:text="${item.codeName}">
						</option>
					</select>
		          </div>

		          <div class="col-md-3">
		            <label class="form-label">단위</label>
					<select id="unit" name="unit" class="form-select form-select-sm">
						<option value="" selected disabled hidden>단위</option>
						<option th:each="item : ${unitTypeList}" 
								th:value="${item.codeId}" 
								th:text="${item.codeName}">
						</option>
					</select>
		          </div>
		
		          <div class="col-md-9">
		            <label class="form-label">기준 텍스트</label>
		            <input type="text" id="stdText" name="stdText" class="form-control form-control-sm"/>
		          </div>
		
		          <div class="col-md-3">
		            <label class="form-label">최소값</label>
		            <input type="number" id="minValue"  name="minValue" class="form-control form-control-sm" />
		          </div>
		          <div class="col-md-3">
		            <label class="form-label">최대값</label>
		            <input type="number" id="maxValue" name="maxValue" class="form-control form-control-sm" />
		          </div>
		
		          <div class="col-md-3">
		            <label class="form-label">정렬순서</label>
		            <input type="number" id="sortOrder" name="sortOrder" class="form-control form-control-sm"/>
		          </div>
		
		          <div class="col-md-3">
		            <label class="form-label">사용여부</label>
		            <select id="useYn" name="useYn" class="form-select form-select-sm">
						<option value="" disabled hidden>활성여부</option>
						<option value="Y">활성</option>
						<option value="N">비활성</option>
					</select>
<!-- 		            <input type="text" id="useYn" name="useYn" class="form-control form-control-sm"/> -->
		          </div>
		          </div> 
		       </div>
		      <div class="modal-footer">
		      	<button type="button" class="btn btn-primary btn-sm" id="saveQcItem">저장</button>
		        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
		      </div>
		      </div>
		    </div>
		  </div>
		</div>
	</div>
</th:block>
</body>
<th:block layout:fragment="myScript"> 
	<script type="text/javascript"
			src="https://uicdn.toast.com/tui.pagination/v3.4.0/tui-pagination.js"></script>
	<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
	<script th:src="@{/js/masterData/gridCustomRenderers.js}"></script>
	<script th:inline="javascript" th:src="@{/js/masterData/qcItem.js}"></script>
</th:block>
