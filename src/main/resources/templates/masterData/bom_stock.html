<th:block xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{/layouts/layout.html}">
<head>
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css}" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/grid/latest/tui-grid.css}" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

<script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<th:block layout:fragment="pageCss">
	<style>
		.tui-grid-cell:has(.modified-cell-highlight) {
			/* 부모 셀의 배경색을 덮어씁니다. */
			background-color: #FFE5E5 !important;
			color: #000 !important;
		}

		.modified-cell-highlight {
			background-color: #FFE5E5 !important;
			color: #000 !important;
			width: 100% !important; 
			height: 100% !important;
			padding: 0 !important; /* 내부 패딩을 제거하여 가장자리까지 채움 */
		}
	</style>
</th:block>
<body>
<th:block layout:fragment="content">
	<div class="custom-body container-xxl flex-grow-1 container-p-y">
	<h2>BOM 정보/안전재고</h2>
	 <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title mb-0"></h5>
        <button class="btn btn-outline-primary btn-md-sm" style="margin-right: 45px;" id="safeStockBtn">
           안전재고
        </button>
      </div>

	  	<div class="nav-align-top mb-4">
	         <div class="tab-content">
				 <div class="d-flex gap-3" data-masonry='{"percentPosition": true }' style="margin:10px;">
					<div class="row" style="width:35%;">
						<div class="d-flex align-items-center justify-content-between mb-2">
							<h5 class="card-title" style="margin-bottom: 28px;">BOM 리스트</h5>
							<button class="btn btn-primary btn-md-sm" id="bomRegistBtn">추가</button>
						</div>
						<div id="bomGrid"></div>				
					</div>
					<div class="row" style="width:70%;">
						<div class="d-flex align-items-center justify-content-between mb-2">
							<h5 class="card-title">BOM ITME</h5>
							<div>
								<button class="btn btn-primary btn-md-sm" id="bomItemRegistBtn" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')">
									추가
								</button>
								<button id=bomItemSaveBtn class="btn btn-success btn-md-sm" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')" type="button">저장</button>
								<button id=bomItemDeleteBtn class="btn btn-danger btn-md-sm" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')" type="button">삭제</button>
							</div>
						</div>
						<div id="bomItemGrid"></div>
					</div>
					</div>
	         </div>
       	</div>
      
		<!-- 안전재고 모달 -->
		<div class="modal fade" id="safeStock-modal" tabindex="-1">
		  <div class="modal-dialog modal-xl modal-dialog-centered">
		    <div class="modal-content">
		      <div class="modal-header">
		        <h2 class="modal-title">안전재고</h2>
		        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		      </div>
		      <div class="modal-body small-text">
				<div class="d-flex g-2 align-items-center">
					<div class="col-12 col-lg d-flex align-items-center gap-2">
						<input type="text" class="form-control" placeholder="품명을 입력하세요" id="materialKeyword" style="width: 65%;">
						<button class="btn btn-outline-primary" id="searchbtn">검색</button>
					</div>
			       	<div class="col-12 col-lg d-flex justify-content-end gap-2">
				  		<button id="addSafetyStockRowBtn" class="btn btn-primary btn-md-sm" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')" type="button" style="margin-right:5px;">추가</button>
						<button id="saveSafetyStockRowBtn" class="btn btn-success btn-md-sm" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')" type="button" style="margin-right:5px;">저장</button>
				  		<button id="deleteSafetyStockRowBtn" class="btn btn-danger btn-md-sm" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')"  type="button">삭제</button>
					</div>
				</div>
		         <div id="safeStockGrid" style="margin-right:5px; margin-top: 1em;"></div>
		      </div>
		      <div class="modal-footer">
		        <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
		      </div>
		    </div>
		  </div>
		</div>
		<!-- BOM 등록 모달 -->
		<div class="modal fade" id="bom-modal" tabindex="-1" style="display: none;" aria-hidden="true">
		  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
		    <div class="modal-content">
		      <div class="modal-header">
		        <h5 class="modal-title">BOM 등록</h5>
		        <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		      </div>
		      <div class="modal-body">
				<div class="d-flex gap-4 mb-3">
					<input type="text" class="form-control" placeholder="BOM 이름을 입력해주세요." id="bomName" style="width: 40%;">
					<input type="text" class="form-control" placeholder="생산할 제품" id="productName" style="width: 40%;" disabled>
					<input type="hidden" class="form-control" id="prdId" style="width: 40%;" disabled>
					<button class="btn btn-primary btn-md-sm" id="searchProduct" style="margin-left: 1em">제품 조회</button>
				</div>
				<div id="bomNameFeedback" class="form-feedback mb-4"></div>
				<div class="d-flex align-items-center justify-content-between mb-2">
					<h5 class="card-title">BOM ITME</h5>
					<div>
						<button class="btn btn-primary btn-md-sm" id="registBtn" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')">추가</button>
						<button id=deleteBtn class="btn btn-danger btn-md-sm" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')" type="button">삭제</button>
					</div>
				</div>
		       	<div id="registBomItemGrid" style="display: grid; margin-top:10px;"></div>
		      </div>
		      <div class="modal-footer">
    		  	  <button class="btn btn-primary btn-sm" id="svaeBomBtn" type="button">저장</button>
		          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
		      </div>
		    </div>
		  </div>
		</div>
		
		<!-- 원재료 id 조회용 모달 -->
		<div class="modal fade" id="matItems-modal" tabindex="-1" style="display: none;" aria-hidden="true">
		  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
		    <div class="modal-content">
		      <div class="modal-header">
		        <h5 class="modal-title">원재료 조회</h5>
		        <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		      </div>
		      <div class="modal-body">
				<div class="d-flex gap-3">
					<input type="text" class="form-control" placeholder="원재료명을 입력하세요" id="materialKeyword" style="width: 220px;">
					<button class="btn btn-outline-primary" id="searchbtn">검색</button>
				</div>
		       	<div id="matItemsGrid" style="margin-right:5px; margin-top: 1em;"></div>
		      </div>
		      <div class="modal-footer">
		        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
		      </div>
		    </div>
		  </div>
		</div>
		
		<!-- 완제품 id 조회용 모달 -->
		<th:block th:insert="~{masterData/modal/productItem}"></th:block>
		
		<!-- 원재료/완제품 조회용 모달 -->
		<div class="modal fade" id="item-modal" tabindex="-1" style="display: none;" aria-hidden="true">
		  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
		    <div class="modal-content">
		      <div class="modal-header">
		        <h5 class="modal-title">품목 조회</h5>
		        <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		      </div>
		      <div class="modal-body">
				<div class="d-flex gap-3">
					<input type="text" class="form-control" placeholder="완제품 또는 원재료를 입력하세요" id="itemKeyword" style="width: 220px;">
					<button class="btn btn-outline-primary" id="searchItemtBtn">검색</button>
				</div>
		       	<div id="itemGrid" style="display: grid;margin-right:5px;"></div>
		      </div>
		      <div class="modal-footer">
		        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
		      </div>
		    </div>
		  </div>
		</div>
		
	</div>
</th:block>
</body>
<th:block layout:fragment="myScript"> 
	<script type="text/javascript"
			src="https://uicdn.toast.com/tui.pagination/v3.4.0/tui-pagination.js"></script>
	<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
	<script th:src="@{/js/masterData/bomGrid.js}"></script>
	<script th:src="@{/js/masterData/bomItemGrid.js}"></script>
<!-- 	<script th:src="@{/js/masterData/productItemGrid.js}"></script> -->
	<script th:src="@{/js/masterData/materialItemGrid.js}"></script>
	<script th:src="@{/js/masterData/safeStockGrid.js}"></script>
	<script th:src="@{/js/masterData/itemGrid.js}"></script>
</th:block>
