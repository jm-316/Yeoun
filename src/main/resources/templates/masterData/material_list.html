<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="material">
	<div class="row g-2 align-items-center">
		<!-- 검색 조건들 묶음 -->
		<div
			class="col-12 col-lg-auto d-flex flex-wrap align-items-center gap-2">
			<div>
			
			</div>
			<!-- 키워드 -->
			<input type="text" class="form-control" placeholder="원재료명 / LOT번호"
				id="materialKeyword" style="width: 220px;">
			<!-- 조회 버튼 -->
			<button class="btn btn-outline-primary" id="searchbtn">검색</button>
		</div>
		<div class="col-12 col-lg d-flex justify-content-end gap-2">
			<button type="button" class="btn btn-primary"
				id="matRegistBtn" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')">추가
			</button>
			<button type="button" class="btn btn-success"
				id="matSaveBtn" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')">저장
			</button>
			<button type="button" class="btn btn-danger"
				id="matDeleteBtn" sec:authorize="hasAnyRole('MES_MANAGER','SYS_ADMIN')">삭제
			</button>
		</div>
	</div>
	<br>
	<div class="card-body p-0">
		<div id="materialGrid"></div>
	</div>
	<th:block layout:fragment="myScript">
		<script type="text/javascript"
			src="https://uicdn.toast.com/tui.pagination/v3.4.0/tui-pagination.js"></script>
		<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
		<script th:src="@{/js/masterData/materialGrid.js}"></script>
	</th:block>
</th:block>
