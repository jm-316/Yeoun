<th:block xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{/layouts/layout.html}">
<head>
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/select-box/latest/toastui-select-box.css}">
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css}" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/grid/latest/tui-grid.css}" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
<link rel="stylesheet" th:href="@{https://uicdn.toast.com/editor/latest/toastui-editor.min.css}" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
<link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css}" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://uicdn.toast.com/select-box/latest/toastui-select-box.js"></script>
<script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
<script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
</head>
<th:block layout:fragment="pageCss">
	<style>
		.approval-doc {
		    background: #f4f4f1;
		    padding: 0;
		}
		
		.modal-body {
		    background: #e5e5e0;
		}
		
		.doc-section {
		    background: #ffffff;
		    margin: 0 auto;
		    width: 210mm;
		    max-width: 100%;
		    padding: 18px 24px;
		    border-left: 1px solid #dee2e6;
		    border-right: 1px solid #dee2e6;
		}
		
		.doc-header {
		    border-top: 2px solid #343a40;
		}
		
		.doc-attachment {
		    border-bottom: 2px solid #343a40;
		}
		
		/* 모달헤드 */
		.doc-info-table,
		.approver-table {
		    width: 100%;
		    border-collapse: collapse;
		    font-size: 14px;
		}
		
		.doc-info-table th,
		.doc-info-table td {
		    border: 1px solid #dee2e6;
		    padding: 6px 8px;
		}
		
		.doc-info-table th {
		    background: #f8f9fa;
		    width: 120px;
		    text-align: center;
		}
		/* 사유내용 영역 */
		.doc-body-title {
		    font-weight: 600;
		    margin-bottom: 4px;
		}
		
		.doc-reason {
		    min-height: 260px;
		    border-radius: 0;
		    border: 1px solid #ced4da;
		}
	</style>
</th:block>
<body>
<th:block layout:fragment="content">
	<!-- 현재사용자 사번, 이름 저장 -->
	<!-- 사원 ID (username) -->
	<input type="hidden" id="currentUserId" th:value="${#authentication.name}">
	<!-- 사용자 이름 (principal.username 또는 empName) -->
	<input type="hidden" id="currentUserName" th:value="${#authentication.principal.empName}">
	
<!-- 	<input type="hidden" id="userRoles" -->
<!-- 	       th:value="${#authentication.principal.empRoles}"> -->
    
     
       
	<div class="custom-body container-xxl flex-grow-1 container-p-y">
		<h2>전자 결재</h2>
		<div class="d-flex justify-content-between">
			<div class="d-flex">
				<div class="d-flex align-items-center gap-2" style="min-width: 280px;margin-right:25px;">
					<div class="mb-6 col-lg-5 col-xl-7 col-12 mb-0" style="width: 400px;">
						<label class="form-label">결재생성일</label>
						<div class="d-flex">
							<div class="mb-6 col-lg-5 col-xl-7 col-12 mb-0" style="width: 180px;">
								<input id="searchStartDate" type="date" name="startDate" class="form-control">
							</div>
							<div class="mb-6 col-lg-5 col-xl-7 col-12 mb-0" style="width:10px; margin-left: auto; margin-right: auto;">
								<span style="margin-top: 33px;">~</span>
							</div>
							<div class="mb-6 col-lg-5 col-xl-7 col-12 mb-0" style="width: 180px;">
		<!-- 						<label class="form-label">결재생성일</label> -->
								<input id="searchEndDate" type="date" name="endDate" class="form-control">
							</div>
						</div>
					</div>g
					<div class="mb-6 col-lg-5 col-xl-7 col-12 mb-0" style="width: 180px;">
						<label class="form-label">기안자및문서제목</label>
						<input id="searchEmpIdAndformType" class="form-control" type="text" placeholder="기안자및문서제목" style="width: 200px;height: 38.94px;margin-left:5px;">
						
					</div>
					<button id="searchBtn" onclick="AllGridSearch()" class="btn btn-primary" style="position: relative;margin-left: 27px;margin-top: 37px;">
						조회
					</button>
				</div>	
			</div>
			<div class="d-flex">
				<div style="margin-left: 5px;">
					<button id="writeBtn" data-action="create"
					    class="btn btn-outline-secondary me-1"
					    style="background-color: #788393; color:#e9ecef; width: 71px;">
    					기안
					</button>
				</div>
			</div>
		</div>
		<hr>
		<div class="col-12">
			<div class="nav-align-top mb-4">
	            <ul class="nav nav-tabs" role="tablist">
					<li class="nav-item">
						<button type="button" class="nav-link" aria-selected="true" id="every-approval">
							전체 결재
						</button>
					</li>
					<li class="nav-item">
						<button type="button" class="nav-link" aria-selected="true" id="my-approval">
							내 기안
						</button>
					</li>
					<li class="nav-item">
						<button type="button" class="nav-link" aria-selected="true" id="wait-approval">
							결재 대기
						</button>
					</li>
					<li class="nav-item">
						<button type="button" class="nav-link" aria-selected="true" id="complete-approval">
							결재 완료
						</button>
					</li>
	            </ul>
	            <div class="tab-content" style="height: auto;">
					<div class="tab-pane fade show active"  id="nav-approval-tab" role="tabpanel">
						<div id="approvalGrid" ></div>
					</div>
	            </div>
        	</div>
		</div>
		
		
	</div>

	<th:block th:insert="~{approval/approval_modal}"></th:block>
	<th:block th:insert="~{approval/approverline_manage}"></th:block>
</th:block>
<!-- 결재문서 모달  -->
</body>

<th:block layout:fragment="myScript"> 
	<script th:inline="javascript" th:src="@{/js/approval/gridCustomRenderers.js}"></script>
	<script th:inline="javascript" th:src="@{/js/approval/approvalDoc.js}"></script>
	<script th:inline="javascript" th:src="@{/js/approval/approvalModal.js}"></script>
	<script th:inline="javascript" th:src="@{/js/approval/approverlineManage.js}"></script>
</th:block>
